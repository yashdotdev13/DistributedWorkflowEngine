
name: V2 CI

on:
  push:
    branches:
      - v2-development
      - feature/**
      - fix/**
  pull_request:
    branches:
      - v2-development

permissions:
  contents: read

concurrency:
  group: v2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Verify V2
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: v2/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and verify
        run: ./mvnw clean verify
