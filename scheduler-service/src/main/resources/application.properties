spring.application.name=scheduler-service


server.port=80831

spring.datasource.url=jdbc:postgresql://localhost:5432/dwe_scheduler_db
spring.datasource.username=postgres
spring.datasource.password=yash8252


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



spring.kafka.bootstrap-servers=localhost:9092


spring.kafka.consumer.group-id=scheduler-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.dwe.common.event

spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
logging.level.root=INFO
logging.level.com.dwe.scheduler=DEBUG
logging.level.org.springframework.kafka=INFO

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false