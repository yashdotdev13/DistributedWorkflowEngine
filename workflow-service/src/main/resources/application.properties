spring.application.name=workflow-service



server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/dwe_workflow_db
spring.datasource.username=postgres
spring.datasource.password=yash8252


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.com.dwe=DEBUG

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false



# KAFKA CONFIG
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=workflow-group
spring.kafka.consumer.auto-offset-reset=earliest